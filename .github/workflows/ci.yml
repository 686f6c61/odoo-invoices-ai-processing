name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            cryptography==48.0.1 \
            mkdocs==1.6.1 \
            Pillow==12.3.0 \
            pypdf==6.14.2 \
            pypdfium2==5.12.1 \
            requests==2.33.0 \
            ruff
      - name: Lint
        run: ruff check .
      - name: Pure Python tests
        run: python -m unittest discover -s tests_unit -v
      - name: Build user manual
        run: mkdocs build --strict
      - name: Build landing container
        run: docker build --tag ai-processing-landing .

  odoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Odoo test image
        run: docker compose -f compose.test.yaml build
      - name: Install module and run Odoo tests
        run: >-
          docker compose -f compose.test.yaml
          up --renew-anon-volumes
          --abort-on-container-exit
          --exit-code-from odoo-test
      - name: Remove test services and volumes
        if: always()
        run: docker compose -f compose.test.yaml down -v
