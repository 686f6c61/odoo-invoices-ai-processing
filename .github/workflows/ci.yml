name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-audit.txt
            requirements-docs.txt
            requirements-ci.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Pure Python tests
        run: python -m unittest discover -s tests_unit -v
      - name: Build user manual
        run: mkdocs build --strict
      - name: Build landing container
        run: docker build --tag ai-processing-landing .

  odoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Odoo test image
        run: docker compose -f compose.test.yaml build
      - name: Install module and run Odoo tests
        run: >-
          docker compose -f compose.test.yaml
          up --renew-anon-volumes
          --abort-on-container-exit
          --exit-code-from odoo-test
      - name: Remove test services and volumes
        if: always()
        run: docker compose -f compose.test.yaml down -v
